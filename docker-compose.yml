# Local dev services. In production: Tiger Cloud + MongoDB Atlas + Redis on Vultr (see infra/).
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dropshot
    ports: ["5432:5432"]
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./backend/data/migrations:/docker-entrypoint-initdb.d:ro   # runs *.sql on first start

  # Optional: only if you don't want to use Atlas while developing offline.
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    profiles: ["local-mongo"]   # start with: docker compose --profile local-mongo up -d

volumes:
  timescale-data:
  mongo-data:
